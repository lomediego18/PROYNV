<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro devoluciones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c363f;
            /* Fondo oscuro exterior */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #384551;
            /* Color de la tarjeta principal */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
        }

        h1 {
            text-align: center;
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #d0d7de;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            background-color: #43515f;
            /* Fondo de los campos de texto */
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .input-field::placeholder {
            color: #a0aec0;
        }

        .input-field:focus {
            background-color: #4a5a6a;
            box-shadow: 0 0 0 2px #63b3ed;
        }

        select.input-field {
            appearance: none;
            cursor: pointer;
        }

        textarea.input-field {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            background-color: #1a232a;
            /* Botón oscuro inferior */
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #12181d;
        }

        /* Ajuste de colores para la lista desplegable */
        option {
            background-color: #384551;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Registro Devolución</h1>

        <form action="#" method="POST">
            <div class="form-group">
                <input type="text" class="input-field" placeholder="ID del Pedido / Producto" required>
            </div>

            <div class="form-group">
                <input type="text" class="input-field" placeholder="Correo" required>
            </div>

            <div class="form-group">
                <select class="input-field" required>
                    <option value="" disabled selected hidden>Motivo de la devolución</option>
                    <option value="defectuoso">Producto defectuoso</option>
                    <option value="incorrecto">Producto incorrecto</option>
                    <option value="insatisfecho">No cumple expectativas</option>
                    <option value="otro">Otro motivo</option>
                </select>
            </div>

            <div class="form-group">
                <textarea class="input-field" placeholder="Detalles o comentarios adicionales"></textarea>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
    </div>

</body>

</html>
